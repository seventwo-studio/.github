name: PR message policy
on:
  workflow_call:
permissions:
  contents: read
  pull-requests: read
jobs:
  validate:
    name: Validate squash title
    runs-on:
      group: amsterdam
      labels: homelab-linux-amd64
    timeout-minutes: 5
    concurrency:
      group: enterprise-pr-message-${{ github.repository }}-${{ github.workflow }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Check current PR title and commit messages
        uses: seventwo-studio/.github/.github/actions/pr-message@4bdd72fc6bba9edfd9c5ce765464ab36ecf3a075
        with:
          token: ${{ github.token }}
