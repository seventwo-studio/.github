name: PR message policy validation
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
jobs:
  test:
    name: Policy and rollout fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.11.0'
      - run: node --test .github/actions/pr-message/policy.test.mjs scripts/rollout-pr-message.test.mjs
      - name: Lint workflow contracts
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck=""
  enterprise-probe:
    name: Enterprise runner probe
    if: github.event_name == 'pull_request'
    uses: seventwo-studio/.github/.github/workflows/pr-message.yml@1a996f46461c95f22b057caf44038ed81c02e00a
